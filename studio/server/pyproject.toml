[project]
name = "dentalsim-studio"
version = "0.1.0"
description = "Simulation Studio server: HTTP API, queue, worker and events over the dentalsim engine"
requires-python = "==3.12.*"
dependencies = [
    "dentalsim",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "argon2-cffi>=23.1",
    "cryptography>=43.0",
    "python-multipart>=0.0.12",
]

[tool.uv.sources]
dentalsim = { workspace = true }

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"
