# Built-in template (slice 1b, task T104). Library settings name parameter keys; opening the template takes the
# current approved version of each entry (its typical value unless a choice is given). Generated by Claude from one
# set of block definitions shared by the slice 1b templates; the design defaults await the owner's approval.
format: dentalsim.template/1
id: full_arch_fixed
name: Full-arch fixed (implants)
prosthesis_type: full_arch_fixed
branch: implant
description: >-
  A mandibular full-arch fixed prosthesis from first molar to first molar on four implants, in the canine and second premolar sites, with pontics between them and a distal cantilever on each side to the first molar; an axial bite on each cantilever.
origin: builtin
approval:
  status: proposed
  proposed_by: Claude
  proposed_on: 2026-11-06
  note: >-
    Design defaults proposed by Claude (task T104), for the owner to approve: the sites and bone shape, the same implant (4.1 x 10 mm) and straight abutment as the single crown, zirconia units 0.4 mm narrower than the mean width of their tooth (molars 10.5 mm, as the single crown), pontics and cantilevers 2 mm above the crest (as the abutment collar, so contact areas and occlusal tables line up), connectors 4 mm high and 5 mm wide (about 16 mm2, near the size often cited as the minimum for posterior zirconia connectors), the load cases, and the fit rules. Anterior pontics have a flat occlusal table, and the connectors from the canines forward are 4 mm high and 3 mm wide. Past the midline (teeth 41 to 46) the sites' +x points distal; the blocks there name their mesial and distal sides anatomically.
detail_level: standard

fit_rules:
  - {rule: region_teeth, min: 12, max: 12}
  - {rule: sites_in_region}
  - {rule: site_space, block: crown-1, setting: mesiodistal_mm, max_excess_mm: 0.5}
  - {rule: site_space, block: crown-2, setting: mesiodistal_mm, max_excess_mm: 0.5}
  - {rule: site_space, block: crown-3, setting: mesiodistal_mm, max_excess_mm: 0.5}
  - {rule: site_space, block: crown-4, setting: mesiodistal_mm, max_excess_mm: 0.5}
  - {rule: site_space, block: pontic-1, setting: mesiodistal_mm, max_excess_mm: 0.5}
  - {rule: site_space, block: pontic-2, setting: mesiodistal_mm, max_excess_mm: 0.5}
  - {rule: site_space, block: pontic-3, setting: mesiodistal_mm, max_excess_mm: 0.5}
  - {rule: site_space, block: pontic-4, setting: mesiodistal_mm, max_excess_mm: 0.5}
  - {rule: site_space, block: pontic-5, setting: mesiodistal_mm, max_excess_mm: 0.5}
