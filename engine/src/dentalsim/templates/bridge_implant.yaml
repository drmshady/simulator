# Built-in template (slice 1b, task T104). Library settings name parameter keys; opening the template takes the
# current approved version of each entry (its typical value unless a choice is given). Generated by Claude from one
# set of block definitions shared by the slice 1b templates; the design defaults are approved by the owner.
format: dentalsim.template/1
id: bridge_implant
name: Bridge (implants)
prosthesis_type: bridge_implant
branch: implant
description: >-
  A three-unit bridge from a mandibular first premolar to the first molar on two implants, with a pontic in the second premolar site and both neighbours present; an axial bite on the pontic and a 30° oblique bite on the molar crown.
origin: builtin
approval:
  status: approved
  proposed_by: Claude
  proposed_on: 2026-11-06
  approved_on: 2026-11-07
  note: >-
    Design defaults proposed by Claude (task T104) and approved by the owner (task T107): the sites and bone shape, the same implant (4.1 x 10 mm) and straight abutment as the single crown, zirconia units 0.4 mm narrower than the mean width of their tooth (molars 10.5 mm, as the single crown), pontics and cantilevers 2 mm above the crest (as the abutment collar, so contact areas and occlusal tables line up), connectors 4 mm high and 5 mm wide (about 16 mm2, near the size often cited as the minimum for posterior zirconia connectors), the load cases, and the fit rules.
detail_level: standard

fit_rules:
  - {rule: region_teeth, min: 3, max: 3}
  - {rule: sites_in_region}
  - {rule: site_space, block: crown-1, setting: mesiodistal_mm, max_excess_mm: 0.5}
  - {rule: site_space, block: crown-2, setting: mesiodistal_mm, max_excess_mm: 0.5}
  - {rule: site_space, block: pontic-1, setting: mesiodistal_mm, max_excess_mm: 0.5}
  - {rule: bone_height, implant: implant-1, margin_mm: 2.0}
  - {rule: bone_height, implant: implant-2, margin_mm: 2.0}

blocks:
  - instance_id: jaw
    type_id: jaw_segment
    type_version: 1.0.0
    attach_to: null
    settings:
      jaw: {kind: design, value: mandible}
      region: {kind: design, value: ["34", "35", "36"]}
      site: {kind: design, value: "34"}
      neighbours: {kind: design, value: ["33", "37"]}
      density_class: {kind: design, value: D2}
      ridge_height_mm: {kind: design, value: 24.0}
      ridge_width_mm: {kind: design, value: 9.0}
      basal_width_mm: {kind: design, value: 11.0}
      crestal_bone_loss_mm: {kind: design, value: 0.0}
      nerve_canal_depth_mm: {kind: design, value: 15.0}
      nerve_canal_diameter_mm: {kind: design, value: 3.0}
      arch_width_mm: {kind: design, value: 45.0}
      segment_extension_mm: {kind: design, value: 9.0}
      cortical_thickness: {kind: library, parameter_key: bone.cortical.thickness.D2}
      cortical_E: {kind: library, parameter_key: bone.cortical.E}
      cortical_nu: {kind: library, parameter_key: bone.cortical.nu}
      cancellous_E: {kind: library, parameter_key: bone.cancellous.E.D2}
      cancellous_nu: {kind: library, parameter_key: bone.cancellous.nu}

  - instance_id: implant-1
    type_id: implant
    type_version: 1.0.0
    attach_to: {instance_id: jaw, attach_point: "site:34"}
    settings:
      diameter_mm: {kind: design, value: 4.1}
      length_mm: {kind: design, value: 10.0}
      collar_mm: {kind: design, value: 0.5}
      thread: {kind: design, value: v_thread}
      thread_pitch_mm: {kind: design, value: 0.8}
      thread_depth_mm: {kind: design, value: 0.35}
      connection: {kind: design, value: internal_conical}
      material: {kind: design, value: titanium_g4}
      healing_state: {kind: design, value: osseointegrated}
      E: {kind: library, parameter_key: material.titanium_g4.E}
      nu: {kind: library, parameter_key: material.titanium_g4.nu}
      strength: {kind: library, parameter_key: material.titanium_g4.yield_strength}

  - instance_id: abutment-1
    type_id: abutment
    type_version: 1.0.0
    attach_to: {instance_id: implant-1, attach_point: platform}
    settings:
      abutment_type: {kind: design, value: straight}
      angle_deg: {kind: design, value: 0.0}
      collar_mm: {kind: design, value: 2.0}
      height_mm: {kind: design, value: 4.0}
      margin_diameter_mm: {kind: design, value: 5.5}
      retention: {kind: design, value: cement}
      material: {kind: design, value: titanium_g5}
      screw_material: {kind: design, value: titanium_g5}
      E: {kind: library, parameter_key: material.titanium_g5.E}
      nu: {kind: library, parameter_key: material.titanium_g5.nu}
      strength: {kind: library, parameter_key: material.titanium_g5.yield_strength}
      screw_E: {kind: library, parameter_key: material.titanium_g5.E}
      screw_nu: {kind: library, parameter_key: material.titanium_g5.nu}
      screw_strength: {kind: library, parameter_key: material.titanium_g5.yield_strength}

  - instance_id: crown-1
    type_id: crown
    type_version: 1.0.0
    attach_to: {instance_id: abutment-1, attach_point: crown_seat}
    settings:
      height_mm: {kind: design, value: 7.5}
      mesiodistal_mm: {kind: design, value: 6.6}
      buccolingual_mm: {kind: design, value: 8.0}
      cusp_height_mm: {kind: design, value: 2.0}
      material: {kind: design, value: zirconia}
      E: {kind: library, parameter_key: material.zirconia.E}
      nu: {kind: library, parameter_key: material.zirconia.nu}
      strength: {kind: library, parameter_key: material.zirconia.flexural_strength}

  - instance_id: implant-2
    type_id: implant
    type_version: 1.0.0
    attach_to: {instance_id: jaw, attach_point: "site:36"}
    settings:
      diameter_mm: {kind: design, value: 4.1}
      length_mm: {kind: design, value: 10.0}
      collar_mm: {kind: design, value: 0.5}
      thread: {kind: design, value: v_thread}
      thread_pitch_mm: {kind: design, value: 0.8}
      thread_depth_mm: {kind: design, value: 0.35}
      connection: {kind: design, value: internal_conical}
      material: {kind: design, value: titanium_g4}
      healing_state: {kind: design, value: osseointegrated}
      E: {kind: library, parameter_key: material.titanium_g4.E}
      nu: {kind: library, parameter_key: material.titanium_g4.nu}
      strength: {kind: library, parameter_key: material.titanium_g4.yield_strength}

  - instance_id: abutment-2
    type_id: abutment
    type_version: 1.0.0
    attach_to: {instance_id: implant-2, attach_point: platform}
    settings:
      abutment_type: {kind: design, value: straight}
      angle_deg: {kind: design, value: 0.0}
      collar_mm: {kind: design, value: 2.0}
      height_mm: {kind: design, value: 4.0}
      margin_diameter_mm: {kind: design, value: 5.5}
      retention: {kind: design, value: cement}
      material: {kind: design, value: titanium_g5}
      screw_material: {kind: design, value: titanium_g5}
      E: {kind: library, parameter_key: material.titanium_g5.E}
      nu: {kind: library, parameter_key: material.titanium_g5.nu}
      strength: {kind: library, parameter_key: material.titanium_g5.yield_strength}
      screw_E: {kind: library, parameter_key: material.titanium_g5.E}
      screw_nu: {kind: library, parameter_key: material.titanium_g5.nu}
      screw_strength: {kind: library, parameter_key: material.titanium_g5.yield_strength}

  - instance_id: crown-2
    type_id: crown
    type_version: 1.0.0
    attach_to: {instance_id: abutment-2, attach_point: crown_seat}
    settings:
      height_mm: {kind: design, value: 7.5}
      mesiodistal_mm: {kind: design, value: 10.5}
      buccolingual_mm: {kind: design, value: 10.0}
      cusp_height_mm: {kind: design, value: 2.0}
      material: {kind: design, value: zirconia}
      E: {kind: library, parameter_key: material.zirconia.E}
      nu: {kind: library, parameter_key: material.zirconia.nu}
      strength: {kind: library, parameter_key: material.zirconia.flexural_strength}

  - instance_id: pontic-1
    type_id: pontic
    type_version: 1.0.0
    attach_to: {instance_id: jaw, attach_point: "site:35"}
    settings:
      mesiodistal_mm: {kind: design, value: 6.6}
      buccolingual_mm: {kind: design, value: 8.0}
      height_mm: {kind: design, value: 7.5}
      cusp_height_mm: {kind: design, value: 2.0}
      occlusal_shape: {kind: design, value: cusped}
      base_clearance_mm: {kind: design, value: 2.0}
      material: {kind: design, value: zirconia}
      E: {kind: library, parameter_key: material.zirconia.E}
      nu: {kind: library, parameter_key: material.zirconia.nu}
      strength: {kind: library, parameter_key: material.zirconia.flexural_strength}

  - instance_id: connector-1
    type_id: splinting_connector
    type_version: 1.0.0
    attach_to: {instance_id: pontic-1, attach_point: connector_mesial}
    settings:
      height_mm: {kind: design, value: 4.0}
      width_mm: {kind: design, value: 5.0}
      material: {kind: design, value: zirconia}
      E: {kind: library, parameter_key: material.zirconia.E}
      nu: {kind: library, parameter_key: material.zirconia.nu}
      strength: {kind: library, parameter_key: material.zirconia.flexural_strength}

  - instance_id: connector-2
    type_id: splinting_connector
    type_version: 1.0.0
    attach_to: {instance_id: crown-2, attach_point: connector_mesial}
    settings:
      height_mm: {kind: design, value: 4.0}
      width_mm: {kind: design, value: 5.0}
      material: {kind: design, value: zirconia}
      E: {kind: library, parameter_key: material.zirconia.E}
      nu: {kind: library, parameter_key: material.zirconia.nu}
      strength: {kind: library, parameter_key: material.zirconia.flexural_strength}

loads:
  - id: axial
    name: Axial bite on the pontic's central fossa
    pattern: single_bite
    force: {kind: library, parameter_key: load.bite_force.premolar}
    direction: {angle_deg: 0, azimuth_deg: 90}
    contact_points:
      - {block: pontic-1, point: central_fossa, share: 1.0}
  - id: oblique
    name: Oblique bite on the molar's buccal cusp, 30° toward lingual
    pattern: single_bite
    force: {kind: library, parameter_key: load.bite_force.molar}
    direction: {angle_deg: 30, azimuth_deg: 90}
    contact_points:
      - {block: crown-2, point: buccal_cusp, share: 1.0}
