  - source: 01M6QDAVHTPRPK6ZY63EZ4X6E2
    value: 4000
    note: 'Introduction: citing Frost 2004, mild overload window 1500-4000 microstrain, pathologic overload above 4000. Caution:
      Frost 2004 Table 2 gives MESp as about 3000 microstrain, not 4000; the 4000 figure is not in the cited source.'
  - source: 01M6QDAVHS17Q6Y4MZ42X5G2MV
    value: 4000
    note: 'Discussion: citing Wiskott & Belser 1999, mild overload 2000-4000 microstrain, pathologic overload above 4000 (fracture
      above 25,000).'
  notes: 'Typical 3000 microstrain is Frost''s MESp in both primary sources (1994, 2004), keeping one coherent primary set
    with the other two edges. The two implant-dentistry papers place the edge at 4000: Suedam 2016 attributes it to Frost
    2004, which does not state it, and Perez-Pevida 2021 takes it from Wiskott & Belser 1999. The median of the four values
    is 3500. Teaching reference only; approximate regions.'
