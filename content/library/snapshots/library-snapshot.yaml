- parameter_key: frost.adapted_upper
  category: frost_window
  label: Frost window edge, adapted / mild overload
  units: microstrain
  typical: 1500
  range:
    min: 1000
    max: 3000
  values_by_source:
  - source: 01M6QDAVHTPRPK6ZY63EZ4X6E0
    value: 1500
    note: 'Abstract: strains above a 1500 microstrain region (the MESm) tend to turn lamellar bone modeling drifts on.'
  - source: 01M6QDAVHTPRPK6ZY63EZ4X6DZ
    value: 1500
    note: 'Abstract: strains in or above the 1500-3000 microstrain range cause bone modelling to increase cortical bone mass;
      lower end listed.'
  - source: 01M6QDAVHTPRPK6ZY63EZ4X6E2
    value: 1500
    note: 'Introduction: citing Frost 2004, adaptation window 50-1500 microstrain, mild overload from 1500.'
  - source: 01M6QDAVHS17Q6Y4MZ42X5G2MV
    value: 2000
    note: 'Discussion: citing Wiskott & Belser 1999, normal load (homeostasis) 100-2000 microstrain, mild overload from 2000.'
  - source: 01M6QDAVHTPRPK6ZY63EZ4X6E1
    value: 1000
    note: 'Table 2: MESm 1000-1500 microstrain, about 20 MPa; lower end listed.'
  notes: Typical 1500 microstrain is Frost's MESm (1994; the upper end of the 1000-1500 range in Frost 2004) and the median
    of the five values. Range min 1000 is the lower end of Frost 2004's MESm; range max 3000 is the upper end of Frost's 1987
    range (1500-3000). Teaching reference only; approximate regions.
  version: 1
