- parameter_key: bone.cortical.nu
  category: bone
  label: Cortical bone Poisson's ratio
  units: '1'
  typical: 0.3
  range:
    min: 0.273
    max: 0.3
  values_by_source:
  - source: 01M6QDAVHTPRPK6ZY63EZ4X6DS
    value: 0.28
    note: 'Results text and Table 5: grand mean of 600 specimens, in-plane Poisson''s ratio nu23 0.28 (SD 0.10), ultrasonic
      method. The other five grand means are nu12 0.18, nu13 0.31, nu21 0.25, nu31 0.53, nu32 0.34 (directions: 1 radial,
      2 tangential, 3 longitudinal); nu23 is listed because it lies in the plane of the cortical plate and agrees with Dechow
      1993.'
  - source: 01M6QDAVHTPRPK6ZY63EZ4X6DT
    value: 0.273
    note: 'Table 4: mandible (n = 17), ultrasonic method, nu23 0.273 (SD 0.080). The other five ratios are nu12 0.274, nu13
      0.237, nu21 0.317, nu31 0.405, nu32 0.376 (subscripts read from a scanned table; the order follows the paper''s convention).'
  - source: 01M6QDAVHS17Q6Y4MZ42X5G2MT
    value: 0.3
    note: 'Table (mechanical properties): cortical bone 0.30. Assumed in an FEA model.'
  - source: 01M6QDAVHS17Q6Y4MZ42X5G2MS
    value: 0.3
    note: 'Table 2: cortical bone 0.3. Assumed in an FEA model.'
  - source: 01M6QDAVHS17Q6Y4MZ42X5G2MV
    value: 0.3
    note: 'Table 1: cortical bone 0.30. Assumed in an FEA model.'
  - source: 01M6QDAVHTPRPK6ZY63EZ4X6DY
    value: 0.3
    note: 'Table 2: compact bone 0.3. Assumed in an FEA model.'
  notes: Two measured human mandible sources (Schwartz-Dabney 2003, Dechow 1993; ultrasonic) give in-plane nu23 of 0.28 and
    0.273, close to the 0.30 assumed in the four FEA papers. Typical 0.30 is the median of the six values. Bone is orthotropic
    and its six Poisson's ratios range from 0.18 to 0.53 (Schwartz-Dabney grand means), so a single isotropic value is a simplification.
    Linear isotropic model.
  version: 1
