- parameter_key: bone.cancellous.E.D1
  category: bone
  label: Cancellous bone elastic modulus, density class D1
  units: MPa
  typical: 9500
  range:
    min: 1370
    max: 9500
  values_by_source:
  - source: 01M6QDAVHS17Q6Y4MZ42X5G2MS
    value: 9500
    note: 'Table 2 and Methods text: cancellous bone 9.5 GPa for D1, citing Azcarate-Velazquez et al. 2019. Assumed in an
      FEA model. 9.5 GPa x 1000.'
  - source: 01M6QDAVHTPRPK6ZY63EZ4X6DW
    value: 9500
    note: 'Table 1: ''Assigned by bone density'', bone type I 9.5 GPa, citing Tada et al. 2003 (an FEA study). Review reporting
      an FEA assumption. 9.5 GPa x 1000.'
  - source: 01M6QDAVHTPRPK6ZY63EZ4X6DX
    value: 1370
    note: 'Table 3: Sevimay et al. 2005 used cancellous 1.37 GPa for D1 to D3 (and 1.1 GPa for D4). Review reporting an FEA
      assumption. 1.37 GPa x 1000.'
  notes: 'WEAK: all values are FEA assumptions, not measurements by density class. Two schools exist: the Tada 2003 / Azcarate-Velazquez
    2019 set (9.5 / 5.5 / 1.6 / 0.69 GPa for D1-D4) varies the cancellous modulus, while Sevimay 2005 and similar models keep
    cancellous bone near 1.37 GPa and represent the class mainly by cortical thickness; several models (Barbosa 2026, Ma 2014)
    treat D1 as all cortical bone. Typical 9,500 MPa is the median and comes from one coherent set (Jemaa 2024) used for all
    four classes and the cortical thickness entries. Caution: measured apparent moduli of human mandibular trabecular bone
    are far lower (3.5-125.6 MPa without cortical plates; Misch, Qu & Bidez 1999, J Oral Maxillofac Surg 57:700-706, doi 10.1016/s0278-2391(99)90437-8),
    not by class.'
