- parameter_key: bone.cortical.E
  category: bone
  label: Cortical bone elastic modulus (jaw)
  units: MPa
  typical: 13700
  range:
    min: 13700
    max: 30000
  values_by_source:
  - source: 01M6QDAVHTPRPK6ZY63EZ4X6DS
    value: 22800
    note: 'Results text (and Table 4 by site): grand mean of 600 specimens from 10 dentate mandibles, ultrasonic method, longitudinal
      modulus E3 22.8 GPa (SD 5.4); E2 17.9 (SD 2.5), E1 12.7 (SD 1.8). Site means of E3 range 17.9-29.8 GPa; abstract gives
      E3 20-30 GPa. 22.8 GPa x 1000.'
  - source: 01M6QDAVHTPRPK6ZY63EZ4X6DT
    value: 19400
    note: 'Table 2: mandible (buccal cortex, n = 17, unembalmed cadavers), ultrasonic method, longitudinal modulus E3 19.4
      GPa (SD 4.0); E2 13.8 (SD 2.8), E1 11.3 (SD 2.4). 19.4 GPa x 1000.'
  - source: 01M6QDAVHTPRPK6ZY63EZ4X6DV
    value: 17700
    note: 'Table 2 (adjusted average 17.7, 95% CI 15.6-19.8) and Discussion: cortical bone 17.7 GPa (nanoindentation, edentulous
      maxillae and mandibles of 4 male cadavers, pooled). 17.7 GPa x 1000. Nanoindentation gives a tissue-level modulus.'
  - source: 01M6QDAVHS17Q6Y4MZ42X5G2MT
    value: 13700
    note: 'Table (mechanical properties): cortical bone 13.7 GPa, citing Sevimay et al. 2005. Assumed in an FEA model. 13.7
      GPa x 1000.'
  - source: 01M6QDAVHS17Q6Y4MZ42X5G2MS
    value: 13700
    note: 'Table 2: cortical bone 13.7 GPa, constant for D1-D4. Assumed in an FEA model. 13.7 GPa x 1000.'
  - source: 01M6QDAVHS17Q6Y4MZ42X5G2MV
    value: 15000
    note: 'Table 1: cortical bone 15 GPa. Assumed in an FEA model. 15 GPa x 1000.'
  - source: 01M6QDAVHTPRPK6ZY63EZ4X6DY
    value: 14700
    note: 'Table 2: compact bone 14.7 GPa. Assumed in an FEA model. 14.7 GPa x 1000.'
  notes: 'Typical 13,700 MPa is the value most often assumed in implant FEA (Barbosa 2026 citing Sevimay 2005; Jemaa 2024),
    chosen so scenarios stay comparable with published studies and consistent with the D1-D4 set below (Jemaa 2024). Measured
    jaw values are higher: 17,700 MPa by nanoindentation (Seong 2009) and, along the long axis, 19,400 MPa (Dechow 1993) and
    22,800 MPa (Schwartz-Dabney 2003 grand mean; the range max of 30,000 is that paper''s stated upper end). Of the measured
    directional moduli, only the radial one (E1 11.3-12.7 GPa) is at or below 13,700. The median of the seven values is 15,000
    MPa. At a given stress, 13,700 MPa gives about 30% more strain than 17,700 MPa, which matters when strains are compared
    with the Frost windows below. Real cortical bone is orthotropic; this entry is for a linear isotropic model. Four of the
    seven sources are FEA assumptions (weak).'
  version: 1
