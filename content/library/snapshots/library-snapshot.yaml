- parameter_key: frost.disuse_upper
  category: frost_window
  label: Frost window edge, disuse / adapted
  units: microstrain
  typical: 50
  range:
    min: 50
    max: 300
  values_by_source:
  - source: 01M6QDAVHTPRPK6ZY63EZ4X6E0
    value: 50
    note: 'Abstract: peak strains below a 50 microstrain region (the MESr) give the largest disuse effects; larger strains
      make remodeling conserve bone.'
  - source: 01M6QDAVHTPRPK6ZY63EZ4X6DZ
    value: 100
    note: 'Abstract: strains below the 100-300 microstrain range release BMU-based remodeling that removes bone; lower end
      listed.'
  - source: 01M6QDAVHTPRPK6ZY63EZ4X6E1
    value: 50
    note: 'Table 2 (set point values, cortical lamellar bone, healthy young-adult mammals): MESr 50-100 microstrain, about
      1-2 MPa; the table adds that ''one can argue for a value of ~400 microstrain''. Lower end listed.'
  - source: 01M6QDAVHTPRPK6ZY63EZ4X6E2
    value: 50
    note: 'Introduction: citing Frost 2004, acute disuse window below 50 microstrain.'
  - source: 01M6QDAVHS17Q6Y4MZ42X5G2MV
    value: 100
    note: 'Discussion: citing Wiskott & Belser 1999, disuse atrophy below 100 microstrain.'
  notes: 'Typical 50 microstrain is Frost''s own later value (1994 and 2004, MESr), giving with the next two entries one coherent
    set (50 / 1500 / 3000) from a single primary author; the median of the five listed values is 50. Range max 300 is the
    upper end of Frost''s 1987 proposal (100-300), which he later lowered. Teaching reference only: thresholds are approximate
    regions, not sharp limits, and come from long-bone studies.'
  version: 1
