  - parameter_key: load.bite_force.molar
    category: load
    label: Maximum voluntary bite force, molar region (adults)
    units: N
    typical: 601.83
    range: {min: 574.9, max: 909}
    values_by_source:
      - source: src-waltimo1993
        value: 847
        note: "Abstract: mean maximal bite force in the molar region 847 N for men and 597 N for women (healthy young adults); men's value listed."
      - source: src-waltimo1995
        value: 909
        note: "Abstract: young Finnish non-patients, molar region 909 N (SD 177) for men and 777 N (SD 168) for women; men's value listed."
      - source: src-sathyanarayana2012
        value: 601.83
        note: "Abstract: class I normal occlusion group (n = 30, both sexes, 17-25 years), first molar region 601.83 +/- 60.80 N."
      - source: src-nguyen2026
        value: 574.9
        note: "Results text and Table 2: control group without sleep bruxism (n = 30, 18-45 years), first molar 574.9 +/- 77.3 N."
    notes: "Typical 601.83 N is a mixed-sex adult mean with normal occlusion (Sathyanarayana 2012), close to Nguyen 2026's controls (574.9 N); the Waltimo values listed are men's means, and their women's means (597 and 777 N) lie inside the range. The median of the four listed values is 724.4 N. Devices and bite height differ between studies. Short maximal bites, not chewing forces."
  - parameter_key: load.bite_force.premolar
