      - source: src-nguyen2026
        value: 447.6
        note: "Results text and Table 2: control group, premolar region 447.6 +/- 63.5 N (abstract: second premolar)."
    notes: "Typical 419.8 N is the mean of the two values. Only two sources; first and second premolars were measured respectively."
  - parameter_key: load.clenching_force
    category: load
    label: Clenching / sleep bruxism bite force
    units: N
    typical: 220.6
    range: {min: 153, max: 796.3}
    values_by_source:
      - source: src-nishigawa2001
        value: 220.6
        note: "Abstract: mean amplitude of 499 nocturnal bruxism events in 10 subjects 22.5 kgf (s.d. 13.0 kgf), first molar transducers on acrylic appliances; 22.5 kgf x 9.80665 = 220.6 N. Highest event per subject averaged 42.3 kgf (414.8 N), range 15.6-81.2 kgf (153.0-796.3 N); daytime maximum voluntary bite force 79.0 kgf (774.7 N)."
    notes: "Typical 220.6 N is the mean bruxism event amplitude; the range is the spread of each subject's highest nocturnal event (15.6-81.2 kgf) stated by the same paper. Nocturnal forces can exceed daytime maximum bite force. WEAK: a single study of 10 bruxers; sustained awake clenching was not sourced separately."
  - parameter_key: load.chewing_cycles_per_year
    category: load
    label: Chewing cycles per year (simulator equivalence)
    units: "1/year"
    typical: 250000
    range: {min: 240000, max: 300000}
    values_by_source:
      - source: src-delong1991
        value: 250000
        note: "Abstract: simulator wear correlated well with clinical wear if 250,000 cycles in the artificial mouth are taken as equivalent to one year in the mouth."
      - source: src-delong2012
        value: 300000
        note: "Abstract: 'a conversion rate of one year equals 3 x 10^5 cycles' gave no significant difference between clinical and simulated composite wear (with two exceptions)."
      - source: src-chang2018
        value: 240000
        note: "Abstract: 240,000 load cycles used to simulate chewing for one year (equivalence assumed, not derived)."
    notes: "Typical 250,000 per year is the median. These are wear-calibrated simulator equivalences (DeLong 1991, 2012) or assumed conventions (Chang 2018), NOT counts derived from chewing strokes per day; no source deriving the figure from daily stroke counts was readable. Use for fatigue-life framing only."
  # ---------------------------------------------------------------------------------------------------------------
  # Frost mechanostat window edges
  # ---------------------------------------------------------------------------------------------------------------
  - parameter_key: frost.disuse_upper
    category: frost_window
    label: Frost window edge, disuse / adapted
    units: microstrain
    typical: 50
    range: {min: 50, max: 300}
    values_by_source:
      - source: src-frost1994
        value: 50
        note: "Abstract: peak strains below a 50 microstrain region (the MESr) give the largest disuse effects; larger strains make remodeling conserve bone."
      - source: src-frost1987
        value: 100
        note: "Abstract: strains below the 100-300 microstrain range release BMU-based remodeling that removes bone; lower end listed."
      - source: src-suedam2016
        value: 50
        note: "Introduction: citing Frost 2004, acute disuse window below 50 microstrain."
      - source: src-perezpevida2021
        value: 100
        note: "Discussion: citing Wiskott & Belser 1999, disuse atrophy below 100 microstrain."
    notes: "Typical 50 microstrain is Frost's own later value (1994, MESr), giving with the next two entries one coherent set (50 / 1500 / 3000) from a single primary source; the median of the four listed values is 75. Range max 300 is the upper end of Frost's 1987 proposal (100-300), which he later lowered. Teaching reference only: thresholds are approximate regions, not sharp limits, and come from long-bone studies."
  - parameter_key: frost.adapted_upper
    category: frost_window
    label: Frost window edge, adapted / mild overload
    units: microstrain
    typical: 1500
    range: {min: 1500, max: 3000}
    values_by_source:
      - source: src-frost1994
        value: 1500
        note: "Abstract: strains above a 1500 microstrain region (the MESm) tend to turn lamellar bone modeling drifts on."
      - source: src-frost1987
        value: 1500
        note: "Abstract: strains in or above the 1500-3000 microstrain range cause bone modelling to increase cortical bone mass; lower end listed."
      - source: src-suedam2016
        value: 1500
        note: "Introduction: citing Frost 2004, adaptation window 50-1500 microstrain, mild overload from 1500."
      - source: src-perezpevida2021
        value: 2000
        note: "Discussion: citing Wiskott & Belser 1999, normal load (homeostasis) 100-2000 microstrain, mild overload from 2000."
    notes: "Typical 1500 microstrain is Frost's MESm (1994) and the median of the four values. Range max 3000 is the upper end of Frost's 1987 range (1500-3000). Teaching reference only; approximate regions."
  - parameter_key: frost.mild_overload_upper
    category: frost_window
    label: Frost window edge, mild overload / pathological overload
    units: microstrain
    typical: 3000
    range: {min: 3000, max: 4000}
    values_by_source:
      - source: src-frost1994
        value: 3000
        note: "Abstract: strains above a 3000 microstrain region (the MESp) can turn woven bone drifts on and increase microdamage; bone's fracture strain is about 25,000 microstrain."
      - source: src-suedam2016
        value: 4000
        note: "Introduction: citing Frost 2004, mild overload window 1500-4000 microstrain, pathologic overload above 4000."
      - source: src-perezpevida2021
        value: 4000
        note: "Discussion: citing Wiskott & Belser 1999, mild overload 2000-4000 microstrain, pathologic overload above 4000 (fracture above 25,000)."
    notes: "Typical 3000 microstrain is Frost's MESp (1994), keeping one coherent primary set with the other two edges; the two implant-dentistry papers place the edge at 4000 (median of the three values is 4000), so the owner may prefer 4000. The Frost 2004 paper cited by Suedam could not be read directly. Teaching reference only; approximate regions."
