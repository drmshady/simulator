    notes: "WEAK: all values are FEA assumptions. Typical 690 MPa is the median of the five values and matches the coherent set used for the other classes (Jemaa 2024; Tada 2003 via Gasik 2021). See the D1 entry for the Misch 1999 caution. Linear isotropic model."
