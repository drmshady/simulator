  - parameter_key: bone.cortical.thickness.D1
    category: bone
    label: Crestal cortical bone thickness, density class D1
    units: mm
    typical: 2.5
    range: {min: 2.5, max: 2.5}
    values_by_source:
      - source: src-jemaa2024
        value: 2.5
        note: "Methods text: cortical thickness 2.5 mm in D1 (2.0 / 1.5 / 1.0 mm in D2 / D3 / D4). Assumed in an FEA model (geometry choice)."
    notes: "WEAK: a single FEA geometry assumption. Other models treat D1 as entirely cortical bone (Barbosa 2026; Ma 2014), so no thickness applies there. Measured mandibular cortical thickness (not by density class) fell from 3.7 mm anteriorly to 1.4 mm posteriorly (Schwartz-Dabney 2003, abstract)."
  - parameter_key: bone.cortical.thickness.D2
    category: bone
    label: Crestal cortical bone thickness, density class D2
    units: mm
    typical: 2
    range: {min: 2, max: 2}
    values_by_source:
      - source: src-jemaa2024
        value: 2
        note: "Methods text: 2.0 mm in D2. Assumed in an FEA model (geometry choice)."
      - source: src-barbosa2026
        value: 2
        note: "Methods: Type II bone (D2) with a 2-mm-thick cortical layer. Assumed in an FEA model."
      - source: src-ma2014
        value: 2
        note: "Methods: D2 model with compact bone 2 mm wide. Assumed in an FEA model."
    notes: "WEAK: FEA geometry assumptions only; no measurement by density class was found. The three models agree on 2 mm."
  - parameter_key: bone.cortical.thickness.D3
    category: bone
    label: Crestal cortical bone thickness, density class D3
    units: mm
    typical: 1.5
    range: {min: 1, max: 1.5}
    values_by_source:
      - source: src-jemaa2024
        value: 1.5
        note: "Methods text: 1.5 mm in D3. Assumed in an FEA model (geometry choice)."
      - source: src-barbosa2026
        value: 1
        note: "Methods: types III (D3) and IV (D4) with a 1-mm-thick cortical layer. Assumed in an FEA model."
      - source: src-ma2014
        value: 1
        note: "Methods: D3 and D4 models with compact bone reduced to 1 mm. Assumed in an FEA model."
    notes: "WEAK: FEA geometry assumptions only. The median is 1.0 mm; typical 1.5 mm is taken from the same coherent set as the other classes (Jemaa 2024), which keeps D3 thicker than D4."
  - parameter_key: bone.cortical.thickness.D4
    category: bone
    label: Crestal cortical bone thickness, density class D4
    units: mm
    typical: 1
    range: {min: 1, max: 1}
    values_by_source:
      - source: src-jemaa2024
        value: 1
        note: "Methods text: 1.0 mm in D4. Assumed in an FEA model (geometry choice)."
      - source: src-barbosa2026
        value: 1
        note: "Methods: types III (D3) and IV (D4) with a 1-mm-thick cortical layer. Assumed in an FEA model."
      - source: src-ma2014
