entries:
  # ---------------------------------------------------------------------------------------------------------------
  # Bone
  # ---------------------------------------------------------------------------------------------------------------
  - parameter_key: bone.cortical.E
    category: bone
    label: Cortical bone elastic modulus (jaw)
    units: MPa
    typical: 13700
    range: {min: 13700, max: 30000}
    values_by_source:
      - source: src-schwartzdabney2003
        value: 20000
        note: "Abstract: dentate human mandibles, ultrasonic method; longitudinal modulus E3 20-30 GPa (lower end listed), 50-100% stiffer than the circumferential/tangential directions. 20 GPa x 1000."
      - source: src-seong2009
        value: 17700
        note: "Table 2 (adjusted average 17.7, 95% CI 15.6-19.8) and Discussion: cortical bone 17.7 GPa (nanoindentation, edentulous maxillae and mandibles of 4 male cadavers, pooled). 17.7 GPa x 1000. Nanoindentation gives a tissue-level modulus."
      - source: src-barbosa2026
        value: 13700
        note: "Table (mechanical properties): cortical bone 13.7 GPa, citing Sevimay et al. 2005. Assumed in an FEA model. 13.7 GPa x 1000."
      - source: src-jemaa2024
        value: 13700
        note: "Table 2: cortical bone 13.7 GPa, constant for D1-D4. Assumed in an FEA model. 13.7 GPa x 1000."
      - source: src-perezpevida2021
        value: 15000
        note: "Table 1: cortical bone 15 GPa. Assumed in an FEA model. 15 GPa x 1000."
      - source: src-ma2014
        value: 14700
        note: "Table 2: compact bone 14.7 GPa. Assumed in an FEA model. 14.7 GPa x 1000."
    notes: "Typical 13,700 MPa is the value most often assumed in implant FEA (Barbosa 2026 citing Sevimay 2005; Jemaa 2024), chosen so scenarios stay comparable with published studies and consistent with the D1-D4 set below (Jemaa 2024). Measured jaw values are higher: 17,700 MPa by nanoindentation (Seong 2009) and 20,000-30,000 MPa along the long axis (Schwartz-Dabney 2003; the range max of 30,000 is that paper's stated upper end). Real cortical bone is anisotropic; this entry is for a linear isotropic model. Four of the six sources are FEA assumptions (weak)."
  - parameter_key: bone.cortical.nu
    category: bone
    label: Cortical bone Poisson's ratio
    units: "1"
    typical: 0.3
    range: {min: 0.3, max: 0.3}
    values_by_source:
      - source: src-barbosa2026
        value: 0.3
        note: "Table (mechanical properties): cortical bone 0.30. Assumed in an FEA model."
      - source: src-jemaa2024
        value: 0.3
        note: "Table 2: cortical bone 0.3. Assumed in an FEA model."
      - source: src-perezpevida2021
        value: 0.3
        note: "Table 1: cortical bone 0.30. Assumed in an FEA model."
      - source: src-ma2014
        value: 0.3
        note: "Table 2: compact bone 0.3. Assumed in an FEA model."
    notes: "WEAK: every source is an FEA paper that assumed 0.30; no measured human jaw value could be read in an accessible source (Dechow et al. 1993 measured it, but the numbers are not in the abstract). The zero-width range reflects only that these models agree, not measured spread. Linear isotropic model."
  - parameter_key: bone.cancellous.E.D1
    category: bone
    label: Cancellous bone elastic modulus, density class D1
    units: MPa
    typical: 9500
    range: {min: 1370, max: 9500}
    values_by_source:
      - source: src-jemaa2024
        value: 9500
        note: "Table 2 and Methods text: cancellous bone 9.5 GPa for D1, citing Azcarate-Velazquez et al. 2019. Assumed in an FEA model. 9.5 GPa x 1000."
      - source: src-gasik2021
        value: 9500
        note: "Table 1: 'Assigned by bone density', bone type I 9.5 GPa, citing Tada et al. 2003 (an FEA study). Review reporting an FEA assumption. 9.5 GPa x 1000."
      - source: src-pradosprivado2020
        value: 1370
        note: "Table 3: Sevimay et al. 2005 used cancellous 1.37 GPa for D1 to D3 (and 1.1 GPa for D4). Review reporting an FEA assumption. 1.37 GPa x 1000."
    notes: "WEAK: all values are FEA assumptions, not measurements by density class. Two schools exist: the Tada 2003 / Azcarate-Velazquez 2019 set (9.5 / 5.5 / 1.6 / 0.69 GPa for D1-D4) varies the cancellous modulus, while Sevimay 2005 and similar models keep cancellous bone near 1.37 GPa and represent the class mainly by cortical thickness; several models (Barbosa 2026, Ma 2014) treat D1 as all cortical bone. Typical 9,500 MPa is the median and comes from one coherent set (Jemaa 2024) used for all four classes and the cortical thickness entries. Caution: measured apparent moduli of human mandibular trabecular bone are far lower (3.5-125.6 MPa without cortical plates; Misch, Qu & Bidez 1999, J Oral Maxillofac Surg 57:700-706, doi 10.1016/s0278-2391(99)90437-8), not by class."
  - parameter_key: bone.cancellous.E.D2
    category: bone
    label: Cancellous bone elastic modulus, density class D2
    units: MPa
    typical: 5500
    range: {min: 1370, max: 5500}
    values_by_source:
      - source: src-jemaa2024
        value: 5500
        note: "Table 2 and Methods text: cancellous bone 5.5 GPa for D2, citing Azcarate-Velazquez et al. 2019. Assumed in an FEA model. 5.5 GPa x 1000."
      - source: src-gasik2021
        value: 5500
        note: "Table 1: 'Assigned by bone density', bone type II 5.5 GPa, citing Tada et al. 2003. Review reporting an FEA assumption. 5.5 GPa x 1000."
      - source: src-pradosprivado2020
        value: 1370
        note: "Table 3: Sevimay et al. 2005 used cancellous 1.37 GPa for D1 to D3. Review reporting an FEA assumption. 1.37 GPa x 1000."
      - source: src-barbosa2026
        value: 1370
        note: "Table (mechanical properties): dense cancellous bone (types II and III) 1.37 GPa. Assumed in an FEA model. 1.37 GPa x 1000."
      - source: src-ma2014
        value: 1470
        note: "Table 2: dense trabecular bone (for D2, D3) 1.47 GPa. Assumed in an FEA model. 1.47 GPa x 1000."
    notes: "WEAK: all values are FEA assumptions. The median of the five values is 1,470 MPa, but typical 5,500 MPa is taken from the same coherent set as D1, D3 and D4 (Jemaa 2024, citing Azcarate-Velazquez 2019; also Tada 2003 via Gasik 2021) so the classes keep their order; the owner may prefer the Sevimay-type 1,370 MPa. See the D1 entry for the Misch 1999 caution that measured mandibular trabecular moduli are much lower. Linear isotropic model."
  - parameter_key: bone.cancellous.E.D3
    category: bone
    label: Cancellous bone elastic modulus, density class D3
    units: MPa
    typical: 1600
    range: {min: 1370, max: 1600}
    values_by_source:
      - source: src-jemaa2024
        value: 1600
        note: "Table 2 and Methods text: cancellous bone 1.6 GPa for D3, citing Azcarate-Velazquez et al. 2019. Assumed in an FEA model. 1.6 GPa x 1000."
      - source: src-gasik2021
        value: 1600
        note: "Table 1: 'Assigned by bone density', bone type III 1.6 GPa, citing Tada et al. 2003. Review reporting an FEA assumption. 1.6 GPa x 1000."
      - source: src-pradosprivado2020
        value: 1370
        note: "Table 3: Sevimay et al. 2005 used cancellous 1.37 GPa for D1 to D3. Review reporting an FEA assumption. 1.37 GPa x 1000."
      - source: src-barbosa2026
        value: 1370
        note: "Table (mechanical properties): dense cancellous bone (types II and III) 1.37 GPa. Assumed in an FEA model. 1.37 GPa x 1000."
      - source: src-ma2014
        value: 1470
        note: "Table 2: dense trabecular bone (for D2, D3) 1.47 GPa. Assumed in an FEA model. 1.47 GPa x 1000."
    notes: "WEAK: all values are FEA assumptions. Typical 1,600 MPa is from the same coherent set as the other classes (Jemaa 2024; Tada 2003 via Gasik 2021); the median of the five values is 1,470 MPa. See the D1 entry for the Misch 1999 caution. Linear isotropic model."
  - parameter_key: bone.cancellous.E.D4
    category: bone
    label: Cancellous bone elastic modulus, density class D4
    units: MPa
    typical: 690
    range: {min: 231, max: 1100}
    values_by_source:
      - source: src-jemaa2024
        value: 690
        note: "Table 2 and Methods text: cancellous bone 0.69 GPa for D4, citing Azcarate-Velazquez et al. 2019. Assumed in an FEA model. 0.69 GPa x 1000."
      - source: src-gasik2021
        value: 690
        note: "Table 1: 'Assigned by bone density', bone type IV 0.69 GPa, citing Tada et al. 2003. Review reporting an FEA assumption. 0.69 GPa x 1000."
      - source: src-pradosprivado2020
        value: 1100
        note: "Table 3: Sevimay et al. 2005 used cancellous 1.1 GPa for D4. Review reporting an FEA assumption. 1.1 GPa x 1000."
      - source: src-barbosa2026
        value: 1100
        note: "Table (mechanical properties): low-density cancellous bone (type IV) 1.10 GPa. Assumed in an FEA model. 1.10 GPa x 1000."
      - source: src-ma2014
