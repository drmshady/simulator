# Seed literature library for bonded, linear-elastic scenarios (task T039).
#
# Prepared by Claude on 2026-11-05 from PubMed / Europe PMC abstracts, open-access full texts (PMC) and Crossref.
# NOT APPROVED. Every entry needs the project owner's review and approval (task T040) before any simulation may use
# it; importing this file creates `proposed` versions only.
#
# Rules followed:
# - Every value_by_source number was read in that source (abstract, a table, or the full text); the note says where.
#   GPa were converted to MPa (x 1000) and kgf to N (x 9.80665); nothing else was changed.
# - The importer allows one value per source per entry. Where a source states a range or several materials, one
#   stated number is listed and the others are given in the note; `range` is widened only to numbers a cited source
#   states, and the entry's `notes` say which.
# - Many values come from finite element papers that ASSUMED them (study_type: fea, note says "assumed in an FEA
#   model"). Those are weak sources and are flagged in each entry's notes.
#
# Source verification. Each DOI was resolved at Crossref (api.crossref.org/works/<doi>) and each PMID at NCBI
# E-utilities (esummary), on 2026-11-05; first-author surname, year and title were compared with the record and the
# title below is copied from it. Where a source has both, both were checked and agree.
#   src-sidambe2014 ......... DOI + PMID 2026-11-05     src-capobianco2023 ...... DOI + PMID 2026-11-05
#   src-vasilescu2026 ....... DOI + PMID 2026-11-05     src-porto2019 ........... DOI + PMID 2026-11-05
#   src-jemaa2024 ........... DOI + PMID 2026-11-05     src-blackburn2018 ....... DOI + PMID 2026-11-05
#   src-barbosa2026 ......... DOI + PMID 2026-11-05     src-awada2015 ........... DOI + PMID 2026-11-05
#   src-perezpevida2021 ..... DOI + PMID 2026-11-05     src-alamoush2018 ........ DOI + PMID 2026-11-05
#   src-kasapoglu2025 ....... DOI + PMID 2026-11-05     src-chung2004a .......... DOI + PMID 2026-11-05
#   src-martinezgrau2024 .... DOI + PMID 2026-11-05     src-chung2004b .......... DOI + PMID 2026-11-05
#   src-mugri2025 ........... DOI + PMID 2026-11-05     src-mahmoudiyamchi2024 .. DOI + PMID 2026-11-05
#   src-schwartzdabney2003 .. DOI + PMID 2026-11-05     src-packaeser2023 ....... DOI + PMID 2026-11-05
#   src-seong2009 ........... DOI + PMID 2026-11-05     src-carek2022 ........... DOI + PMID 2026-11-05
#   src-gasik2021 ........... DOI + PMID 2026-11-05     src-tribst2020 .......... DOI + PMID 2026-11-05
#   src-pradosprivado2020 ... DOI + PMID 2026-11-05     src-sahinhazir2025 ...... DOI + PMID 2026-11-05
#   src-ma2014 .............. DOI + PMID 2026-11-05     src-aljabbari2024 ....... DOI + PMID 2026-11-05
#   src-frost1987 ........... DOI + PMID 2026-11-05     src-konieczny2024 ....... DOI + PMID 2026-11-05
#   src-frost1994 ........... PMID only  2026-11-05     src-schettini2025 ....... DOI + PMID 2026-11-05
#   src-suedam2016 .......... DOI + PMID 2026-11-05     src-waltimo1993 ......... DOI + PMID 2026-11-05
#   src-belli2017 ........... DOI + PMID 2026-11-05     src-waltimo1995 ......... DOI + PMID 2026-11-05
#   src-wendler2017 ......... DOI + PMID 2026-11-05     src-sathyanarayana2012 .. PMID only  2026-11-05
#   src-borba2011 ........... DOI + PMID 2026-11-05     src-nguyen2026 .......... DOI + PMID 2026-11-05
#   src-miranda2018 ......... DOI + PMID 2026-11-05     src-nishigawa2001 ....... DOI + PMID 2026-11-05
#   src-guazzato2004a ....... DOI + PMID 2026-11-05     src-delong1991 .......... DOI + PMID 2026-11-05
