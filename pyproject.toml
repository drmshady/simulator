[project]
name = "simulator"
version = "0.1.0"
description = "Workspace root for the Simulation Studio: the dentalsim engine and the studio server"
requires-python = "==3.12.*"
dependencies = [
    "dentalsim",
    "dentalsim-studio",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml",
    "types-psutil",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["engine", "studio/server"]

[tool.uv.sources]
dentalsim = { workspace = true }
dentalsim-studio = { workspace = true }

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["studio/ui", "fea-implant-teaching"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["dentalsim", "dentalsim_studio"]

[tool.mypy]
python_version = "3.12"
files = ["engine/src", "studio/server/src"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "gmsh",
    "pyvista.*",
    "imageio_ffmpeg.*",
    "pptx.*",
    "typst.*",
    "pygltflib.*",
    "skfem.*",
    "kokoro.*",
    "soundfile.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["engine/tests", "studio/server/tests"]
addopts = ["--strict-markers", "--import-mode=importlib"]
markers = [
    "unit: single functions and modules",
    "integration: pipeline and API, at small sizes",
    "benchmark: needs the solver (DENTALSIM_CCX): textbook and published cases",
    "regression: reference numbers of every published scenario",
]
